name: Reusable Docker Publish

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_registry:
        required: true
        type: string
      APP_VERSION:
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  get-token-and-build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        fetch-tags: true
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.image_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: extract tags and labels
        id: meta
        uses: docker/metadata-action@v6
        tags: |
          type=semver,pattern={{version}}
        with:
          images: ${{ inputs.image_registry }}/${{ github.actor }}/${{ inputs.image_name }}
      - name: tag check
        run: echo "tag is ${{ steps.meta.outputs.tags}}"
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
