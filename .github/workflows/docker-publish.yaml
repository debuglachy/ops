name: Reusable Docker Publish

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_registry:
        required: true
        type: string
      app_version:
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  get-token-and-build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.image_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: extract tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          tags: |
            type=ref,event=push
            ${{ inputs.app_version }}
            type=semver,pattern=v{{major}},value=${{ inputs.app_version }}
          images: ${{ inputs.image_registry }}/${{ github.actor }}/${{ inputs.image_name }}
      - name: tag check
        run: echo "tag is ${{ steps.meta.outputs.tags}}"
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
