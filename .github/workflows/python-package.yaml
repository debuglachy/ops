name: Reusable Python Package

on:
  workflow_call:
    inputs:
      python_version:
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ inputs.python_version }}
    - name: Get dependencies
      run: python -m pip install pre-commit
    - name: run pre-commit
      run: |
        (git rev-parse --verify -q HEAD^2{commit} || echo)
        git log -1 --pretty=%B HEAD^2 > /tmp/COMMIT_MSG
        pre-commit run --hook-stage commit-msg --commit-msg-filename /tmp/COMMIT_MSG
