name: Reusable Python Coverage

on:
  workflow_call:
    inputs:
      src_folder:
        required: true
        type: string
      python_version:
        required: true
        type: string

permissions:
  pull-requests: write
  contents: read

jobs:
  python-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ inputs.python_version }}
      - name: Get app dep
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
          python -m pip install coverage==7.9
          python -m pip install pytest-cov==6.2.1
      - name: Check coverage
        run: python -m pytest -v --cov=${{ inputs.src_folder }}
      - name: Comment coverage
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          ACTIVITY: "${{ github.event_name == 'push' && 'save_coverage_data_files' || 'process_pr' }}"
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70
          VERBOSE: true
      - name: Fail low coverage
        run: coverage report --fail-under=90