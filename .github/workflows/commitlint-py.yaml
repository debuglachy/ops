name: Reusable Commit Lint (using Python for setup)

on:
  workflow_call:
    inputs:
      python_version:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  commitlint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - name: Get code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ inputs.python_version }}
    - name: Get lint dependency
      run: python -m pip install pre-commit
    - name: Lint conventional commit syntax
      run: |
        (git rev-parse --verify -q HEAD^2{commit} \
        && git log -1 --pretty=%B HEAD^2 > /tmp/COMMIT_MSG \
        && pre-commit run --hook-stage commit-msg --commit-msg-filename /tmp/COMMIT_MSG) \
        || echo
